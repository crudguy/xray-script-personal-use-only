# 站点模板: CDN 域名
#
# 这是**占位符模板**, 不是可直接使用的站点配置。脚本 (handler.sh 的
# _change_domain_render) 会把它复制到 sites-available/<你的 CDN 域名>.conf, 再把
# 模板里的占位域名与占位路径整串替换成真实值 (server_name 与证书路径都会跟着变)。
#
# 与主域名模板的区别只在 TCP 入口: 主域名由 stream 直接转给 Xray, 而本域名
# (套 CDN 的那条线) 由 stream 转给**本 server** 的 unix socket, 在这里终结 TLS,
# 再把 XHTTP 入口反代给 Xray 的 XHTTP 入站 (unix:/dev/shm/nginx/to_xray_xhttp.sock)。
# 上游 socket 名与 stream.conf 的 upstream 一一对应, 改名必须两边同改。
#
# UDP 443 共享同一个 listen (选站靠 SNI -> server_name); `quic reuseport` 只由
# 主域名模板声明, 这里**不能**再写, 否则 nginx 报 duplicate listen options 起不来。

server {
    listen                unix:/dev/shm/nginx/cdn_to_nginx.sock ssl proxy_protocol;
    listen                443 quic;
    listen                [::]:443 quic;
    server_name           example.com;

    ssl_certificate       /usr/local/nginx/conf/certs/example.com/fullchain.pem;
    ssl_certificate_key   /usr/local/nginx/conf/certs/example.com/privkey.pem;

    # TCP 入口来自 stream 的 proxy_protocol, 靠它还原真实客户端 IP
    set_real_ip_from      unix:;
    real_ip_header        proxy_protocol;

    add_header            Alt-Svc 'h3=":443"; ma=86400' always;

    include               nginxconfig.io/security.conf;

    # XHTTP 入口 (net=xhttp 的 REALITY 入站, 见 config/xray/SNI.json)
    location /yourpath {
        proxy_pass        http://unix:/dev/shm/nginx/to_xray_xhttp.sock;
        include           nginxconfig.io/proxy.conf;
    }

    include               nginxconfig.io/general.conf;
}
