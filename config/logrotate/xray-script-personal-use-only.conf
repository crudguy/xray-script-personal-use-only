# xray_script
# xray-script-personal-use-only 日志轮转配置 —— 由脚本安装到 /etc/logrotate.d/xray-script-personal-use-only
#
# 为什么需要: Nginx 站点日志与 Xray 访问日志默认只增不减, 长期运行的机器会把磁盘写满。
# 本项目的"一键体检"只在单文件超过 100MB 时告警, 属于事后发现, 不能替代轮转。
#
# 取舍:
#   - 用 copytruncate 而非 create: Nginx/Xray 以 root 或专用用户持有已打开的 fd,
#     轮转时不重启服务、不丢日志, 代价是切换瞬间可能丢极少量行 (可接受)。
#   - compress + delaycompress: 保留最近一份未压缩, 便于 tail 实时排查。
#   - 不写 su 指令: copytruncate 模式下不需要切换用户读写。
#   - missingok: 非 SNI 模式下可能没有 nginx 日志目录, 不应因此报错。

/var/log/nginx/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}

/var/log/xray/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# 脚本自身的审计日志 (${SCRIPT_CONFIG_DIR}/audit.log): 只含操作元数据, 体积小,
# 但无人值守的机器上仍会累积, 按月保留一年即可。
# 注: 这里**是**硬编码的多条 glob —— TLS-PSA 场景用户 healthcheck.sh 以建站用户运行,
#     通常非 root, 故先写 /home/* 通配覆盖所有家目录, 再显式补一条 /root 兜住
#     以 root 安装/运行的情形。两条都写才不至于漏; 早期注释称"不硬编码 /root"属自相矛盾。
/home/*/.xray-script-personal-use-only/audit.log
/root/.xray-script-personal-use-only/audit.log {
    monthly
    rotate 12
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
