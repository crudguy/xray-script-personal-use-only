# 站点模板: 主域名 (Reality)
#
# 这是**占位符模板**, 不是可直接使用的站点配置。脚本 (handler.sh 的
# _change_domain_render) 会把它复制到 sites-available/<你的域名>.conf, 再把
# 模板里的占位域名与占位路径整串替换成真实值 (server_name 与证书路径都会跟着变)。
#
# TCP 入口刻意**不在这里**: modules-enabled/stream.conf 按 SNI 把本域名的 443/TCP
# 直接转给 Xray 的 Vision + REALITY 入站
# (unix:/dev/shm/nginx/nginx_to_xray_vision.sock, 见 config/xray/SNI.json),
# 由 Xray 自己完成 TLS。因此本 server 不监听任何 TCP, 只负责 UDP/443 的 HTTP/3。
#
# UDP 443 是多个站点共享的同一个 listen, 选站靠 SNI -> server_name。
# `quic reuseport` 全库**只允许出现一处** (nginx 限制: 同一 listen 重复声明会
# `[emerg] duplicate listen options for 0.0.0.0:443` 直接起不来), 故由本模板持有,
# cdn 与 custom-site 模板只写 `listen 443 quic`。改这里会连带影响另外两个模板。

server {
    listen                443 quic reuseport;
    listen                [::]:443 quic reuseport;
    server_name           example.com;

    ssl_certificate       /usr/local/nginx/conf/certs/example.com/fullchain.pem;
    ssl_certificate_key   /usr/local/nginx/conf/certs/example.com/privkey.pem;

    # 404 等非 2xx 响应也要广告 H3, 否则客户端只在拿到 200 时才升级到 QUIC
    add_header            Alt-Svc 'h3=":443"; ma=86400' always;

    include               nginxconfig.io/security.conf;

    # XHTTP 入口 (net=xhttp 的 REALITY 入站, 见 config/xray/SNI.json)
    location /yourpath {
        proxy_pass        http://unix:/dev/shm/nginx/to_xray_xhttp.sock;
        include           nginxconfig.io/proxy.conf;
    }

    include               nginxconfig.io/general.conf;
}
