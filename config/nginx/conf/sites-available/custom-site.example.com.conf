# 站点模板: 自定义域名 / 反代应用
#
# 这是**占位符模板**, 不是可直接使用的站点配置。脚本 (handler.sh 的
# render_custom_site_config) 会为每个自定义站点复制一份, 再把模板里的
# 占位域名、站点专属 socket 路径、反代目标三处整串替换成真实值
# (同一个模板可以渲染出任意多个互不相同的站点)。
#
# 注意**不要**改写 unix socket 那行的形式: 脚本按字面量做整串替换, 认不出就会
# 把监听地址留在模板态, 站点起不来。socket 名要与 stream.conf 里该站点的
# upstream 同名 (按域名哈希 + 端口派生)。
#
# UDP 443 共享同一个 listen (选站靠 SNI -> server_name); `quic reuseport` 只由
# 主域名模板声明, 这里**不能**再写, 否则 nginx 报 duplicate listen options 起不来。

server {
    listen                unix:/dev/shm/nginx/custom_site.sock ssl proxy_protocol;
    listen                443 quic;
    listen                [::]:443 quic;
    server_name           example.com;

    ssl_certificate       /usr/local/nginx/conf/certs/example.com/fullchain.pem;
    ssl_certificate_key   /usr/local/nginx/conf/certs/example.com/privkey.pem;

    # TCP 入口来自 stream 的 proxy_protocol, 靠它还原真实客户端 IP
    set_real_ip_from      unix:;
    real_ip_header        proxy_protocol;

    add_header            Alt-Svc 'h3=":443"; ma=86400' always;

    # 反代应用由被代理的应用自己控制 CSP, 故用 security-proxy.conf 而非 security.conf
    include               nginxconfig.io/security-proxy.conf;

    location / {
        proxy_pass          PROXY_TARGET;
        include             nginxconfig.io/proxy.conf;
    }

    include               nginxconfig.io/general.conf;
}
